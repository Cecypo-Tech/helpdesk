              - generic [ref=e764]: Virenchi Joshi
              - generic [ref=e765]: "OFFICIAL PRESS STATEMENT Chairman’s Briefing – Nationwide Transport Strike. To all members of the public and transport stakeholders, I issue this official briefing to update the nation on the status and direction of our ongoing nationwide transport strike Current Situation. Full Cooperation: The suspension of transport services is being observed across the country. Commercial transport operators and private motorists and Rig owners have voluntarily withdrawn from the roads, resulting in a successful, peaceful, and comprehensive national shutdown. Prioritize Peace: We urge the general public, drivers, SACCO leadership, and all stakeholders to remain calm and conduct themselves strictly within the law. Avoid provocation and maintain discipline at all times. Zero Disruption: We uphold a firm zero‑tolerance stance against violence, harassment, intimidation, or vandalism. Any unlawful conduct should be reported immediately to law enforcement agencies. Emergency Access: Let us safeguard one another. Ensure that ambulances, fire services, and other emergency vehicles are granted unhindered passage. Please assist vulnerable persons who may require urgent support. Upcoming Briefing: A definitive directive will be issued at 5:00 PM today. This communication will outline the next phase of our action and provide clarity on the expected timeline. Verified Information Only: To curb misinformation, all press and public inquiries must be directed exclusively to the Matatu Owners Association Communications Desk. Kindly disregard any statements circulating from unverified or unofficial sources. Finally We urge goverment officials and politicians to refrain from making reckless inflammatory statements. Our collective stance is anchored in determination, unity, and civic responsibility. We remain steadfast in advocating for equitable fuel pricing and economic relief for our operators—without compromising the peace, safety, and dignity of our nation. In solidarity and peace, Albert Karakacha President , Matatu Owners Association."
