              - generic [ref=e747]: Treasury Says Fuel Prices Will Remain Until June Review Amid Nationwide Transport Strike Treasury Cabinet Secretary John Mbadi has confirmed that current fuel prices will remain in place until the next review by the Energy and Petroleum Regulatory Authority scheduled for June 14. Speaking on Monday amid widespread transport disruptions caused by the ongoing matatu strike, Mbadi said the government is monitoring the situation closely but maintained that no immediate changes would be made to pump prices. The CS noted that the government could consider additional interventions, including reducing VAT on fuel again, if global prices continue rising and the current Ksh5 billion fuel subsidy becomes insufficient. Mbadi also urged EPRA and the Ministry of Energy to improve communication ahead of future fuel reviews to avoid shocking Kenyans with abrupt price changes. He arguing that the fuel crisis is largely driven by global market pressures linked to the ongoing tensions involving the United States and Iran.
