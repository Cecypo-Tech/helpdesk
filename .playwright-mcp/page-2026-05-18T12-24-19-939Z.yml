At approx. 11:10 A.M. protesters blocked Thika Superhighway with bonfires at Juja town. At approx. 11:12 A.M. residents in Kimbo, Ruiru along Thika Superhighway staged a protest in sections of the highway. *Mura'ga County*: At approx. 11:30 A.M. protesters blocked a section of the Mukuyu-Kambirwa road at Mukuyu area with burning tyres. *Kirinyaga County*: At approx. 11:30 A.M. police cleared bonfire lit by protesters at Ngurubani town along Mwea-Embu Highway in Kirinyaga county. The area remains calm but largely deserted, with no vehicles in sight. At approx. 11:30 A.M. police have dispersed a group of individuals around Piai and Gathoge areas along Mwea-Embu Highway in Kirinyaga county. The group was allegedly forcing motorists to pay Ksh 100 to pass through the areas. At approx. 11:45 A.M. protesters lit tyres in Kagio and Kutus towns in Kirinyaga county. At approx. 11:45 A.M. heavy protests were reported in several areas within Kerugoya town with bonfires lit along multiple streets. *Machakos County*: At approx. 10:10 A.M. police deployed CS gas to disperse a group of protesters who blocked Kangundo road at Koma area in Matungulu. At approx. 10:40 A.M. a group of youth armed with machetes allegedly attacked vehicles IVO Bamburi Cement along Mombasa Road, affecting movement in the area. *Makueni County*: At approx. 11:22 A.M. protesters reportedly set ablaze the UDA offices in Wote Town after allegedly overwhelming the police and are torching UDA offices in Wote Town. Police reinforcement being called. *Kitui County*: At approx. 11:35 A.M. protesters lit bonfires in Kitui town. *Kajiado County*: At approx. 10:20 A.M. police engaged protesters who blocked the Nairobi – Namanga highway at Kitengela town. At approx. 11:10 A.M. protesters blocked sections of Ngong Road at Ngong town. *Taita Taveta County*: At approx. 10:20 A.M. protesters blocked the Voi – Taveta road blocked at Mwatunge area with stones. *Tharaka Nithi County*: At approx. 11:03 A.M. protesters blocked the Embu–Meru Highway at the National Oil petrol station, Chuka town with stones, lighting bonfires. *Bungoma, Kakamega, Kisumu, Trans Nzoia, Uasin Gishu counties*: At approx. 10:10 A.M. PSVs at Bungoma Bus Stage, Kitale Bus Park, Kakamega Matatu Stage, Kisumu Bus Park and Eldoret Bus Park are not operational. *Bomet County*: At approx. 10:20 A.M. protesters lit bonfire Bomet bus stage in Bomet town. *Kisii County*: At approx. 11:27 A.M. protesters blocked a section of the the Kisii-Sotik road with stones. At approx. 11:30 A.M. a bonfire was lit at a bus park in Ogembo town, Kisii County. *Kakamega County*: At approx. 11:35 A.M. protesters blocked the Kakamega-Kisumu Road, light bonfires at Kakmega town. *ADVISORY*: The public is advised to anticipate significant disruption to public transport services, including fare increases, traffic congestion, delays in cargo movement, and potential demonstrations in major urban areas and along key highways."
