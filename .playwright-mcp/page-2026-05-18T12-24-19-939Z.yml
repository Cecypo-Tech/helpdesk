              - generic [ref=e964]: "*SITUATION UPDATE: MONDAY, 18 MAY 2026 | 2:07 PM* *LOCATION*: Nationwide *OCCASSION*: Transport Sector Alliance Industrial Action *UPDATE 5 | 2:00 PM* *Nairobi County*: At approx. 12:02 P.M., police arrested several protesters IVO National Archives along Moi Avenue in Nairobi CBD whilst also deploying CS gas to disperse others in the area. At approx. 12:45 P.M., protesters lit bonfire along Waiyaki Way at Kangemi's Sodom area. At approx. 12:58 P.M., protesters lit bonfire along Thika Superhigway at Roysambu area. *Kiambu County*: At approx. 12:02 P.M., police and other officials conducted clearance operations along sections of the Southern Bypass IVO Kikuyu town, removing stones and debris previously obstructing movement. At approx. 12:30 P.M., protesters lit a bonfire in Thindigua area, Kiambu County. At approx. 12:30 P.M., at least two people were allegedly shot and injured during running battles between police and protesters who had blocked Thika-Garissa highway at BAT, Makongeni area, Thika. At approx. 1:23 P.M., protesters blocked the Narobi-Garissa road at Kisii Estate in Thika with stones. *Meru County*: At approx. 12:02 P.M., police in Meru county cleared stone barricades on Nkubu-Thingithu-Uruku stretch. At approx. 12:05 P.M., police engaged in running battles with protesters who lit bonfires at Makutano area, Meru county. *Embu County*: At approx. 12:03 P.M., police removed road barricades along Muthatari-Siakago road in Embu county. *Machakos County*: At approx. 12:03 P.M., police engaged protesters in running battles at Machakos town center. The protesters had lit a bonfire at the town center earlier. At approx. 1:12 P.M., protesters blocked Mombasa road at Mlolongo area with stones. *Nakuru County*: At approx. 12:03 P.M., protesters reportedly broke into Powerstar Supermarket, Naivasha town. Police deployed to the area. At approx. 1:34 P.M., protesters blocked Kenyatta avenue in Nakuru town with stones. *Marsabit County*: At approx. 12:30 P.M. protesters lit a bonfire in Marsabit town. *Kajiado County*: At approx. 12:35 P.M., protesters broke into Coca-Cola depot in Kitengela town allegedly looting items. Police managed to disperse them. *Narok County*: At approx. 1:00 P.M., police engaged protesters in running battles in Narok town IVO new QuickMart supermarket. Protesters had earlier barricaded the road around the area with stones. *Nandi County*: At approx. 1:00 P.M., police in Kapsabet town, removed stones and wooden planks used by the protesters to block the Kapsabet-Chavakali Road in the town earlier. *Kitui County*: At approx. 12:34 P.M., police engaged protesters in running battles in Kitui town. *Murang'a County*: PSVs are not operational in Murang'a as of 1:00 P.M. *Kakamega County*: At approx. 1:00 P.M., one individual was shot and injured IVO Bukhungu Stadium in Kakamega town. *ADVISORY*: The public is advised to anticipate significant disruption to public transport services, including fare increases, traffic congestion, delays in cargo movement, and potential demonstrations in major urban areas and along key highways."
