              - generic [ref=e1138]: "*Matatu Owners Demand VAT, Levy Cuts as They Seek Talks to End Crippling Transport Strike* The Matatu Owners Association has called for urgent dialogue with the government to resolve the ongoing nationwide transport strike triggered by rising fuel prices. Speaking during a press briefing, MOA chairman Albert Karakacha said matatu operators and transport stakeholders are ready to engage the government in talks to avert continued paralysis across major towns and cities. Karakacha warned that the strike could continue if authorities fail to address concerns over soaring fuel costs, insisting that operators cannot continue transferring the burden to ordinary Kenyans. The association is demanding the removal of the 8 per cent VAT on fuel and the Ksh25 Road Maintenance Levy, arguing that the taxes are driving pump prices to unsustainable levels. MOA also claimed the government had not formally reached out to transport stakeholders despite widespread disruptions affecting commuters and businesses. Meanwhile, Treasury Cabinet Secretary John Mbadi confirmed that the government plans to hold discussions with matatu operators and energy sector agencies to explore possible measures to cushion Kenyans from the impact of rising fuel prices. -CN"
