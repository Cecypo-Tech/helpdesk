              - generic [ref=e586]: "BREAKING: The Supreme Court has just made a massive ruling on YOUR pension money. Attorney General Dorcas Oduor and 3 others LOST the case while defending the government’s position. For years, the government treated pension money deducted from workers’ salaries as if it were public money. That is why pension schemes faced endless bureaucracy, procurement rules, delays, and costly approvals before investing your savings. The Association of Retirement Benefits Schemes challenged this in court. They lost in the High Court. Lost again in the Court of Appeal. But on 15th May 2026, the Supreme Court finally ruled in their favour. The court declared that pension schemes sponsored by public entities and state corporations are PRIVATE TRUSTS, not government money. Meaning? Your pension is YOUR money. Not the government’s. Trustees can now invest faster, avoid unnecessary procurement bureaucracy, and potentially grow retirement savings better for millions of Kenyans. This is one of the biggest financial rulings most wananchi have never heard about."
