              - generic [ref=e906]: "*UDA Office Torched in Wote as Fuel Price Protests Escalate* An office belonging to the ruling United Democratic Alliance was set ablaze in Wote on Monday as protests over rising fuel prices intensified across the country. According to reports, angry protesters stormed the premises, vandalised property, and later set part of the office on fire during demonstrations linked to the ongoing transport strike and high fuel costs. Videos circulating online showed thick smoke billowing from the building as residents gathered nearby to watch firefighters and locals contain the blaze. No injuries were immediately reported, although property damage was reported following the incident. The unrest comes amid nationwide protests triggered by recent fuel price hikes announced by the Energy and Petroleum Regulatory Authority, which pushed petrol and diesel prices to record highs and sparked transport paralysis in several towns. Police continued patrolling affected areas as authorities monitored the protests, which have disrupted transport and business operations across parts of the country. Cyprian"
